{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">{{ user.username }}</div><h1>Change password</h1></div></div>
<form method="post" class="panel" style="max-width:420px;display:grid;gap:14px">
  <div class="f"><label for="current">Current password</label><input id="current" name="current" type="password" required autocomplete="current-password"></div>
  <div class="f"><label for="new">New password <span>(min 6 characters)</span></label><input id="new" name="new" type="password" required minlength="6" autocomplete="new-password"></div>
  <div class="f"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" required minlength="6" autocomplete="new-password"></div>
  <div class="actions"><button class="btn" type="submit">Change password</button></div>
</form>
{% endblock %}
